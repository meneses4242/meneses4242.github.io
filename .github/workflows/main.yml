name: Deploy Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: ci
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.release.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Process
        env:
          A8BC76: ${{ secrets.A8BC76 }}
          B73B98: ${{ secrets.B73B98 }}
        run: |
          python3 -c "
          import pathlib, sys, os
          env_a = os.environ.get('A8BC76', '')
          env_b = os.environ.get('B73B98', '')
          doc = pathlib.Path('index.html')
          body = doc.read_text(encoding='utf-8')
          result = body
          if env_a:
              result = result.replace('<!-- 48faa5b2a5127d666d7db0b808ab7b -->', env_a)
          if env_b:
              result = result.replace('<!-- c881d4eb472d94d7376d4801a9f301a055 -->', env_b)
          if result == body and (env_a or env_b):
              sys.exit(1)
          if result != body:
              doc.write_text(result, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: release
        uses: actions/deploy-pages@v4
